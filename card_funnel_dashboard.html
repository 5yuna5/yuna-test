<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신규 입회 퍼널 대시보드 | GoWid</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      --bg: #f1f5f9;
      --bg-secondary: #e8edf4;
      --filter-bg: #eef2f7;
      --card: #ffffff;
      --card-elevated: #ffffff;
      --border: rgba(30,41,59,0.10);
      --border-strong: rgba(30,41,59,0.18);
      --text: #374151;
      --text-muted: #6b7280;
      --text-strong: #0f172a;
      --primary: #3b82f6;
      --primary-dim: rgba(59,130,246,0.08);
      --accent: #f06060;
      --success: #34d399;
      --warning: #fbbf24;
      --info: #818cf8;
      --orange: #fb923c;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --radius: 12px;
      --radius-sm: 8px;
      --section-gap: 32px;
    }

    html.dark-mode, body.dark-mode {
      --bg: #0c1222;
      --bg-secondary: #0f172a;
      --filter-bg: #151e30;
      --card: #182136;
      --card-elevated: #1e293b;
      --border: rgba(148,163,184,0.12);
      --border-strong: rgba(148,163,184,0.22);
      --text: #cbd5e1;
      --text-muted: #7b8ba3;
      --text-strong: #f1f5f9;
      --primary: #5b9cf6;
      --primary-dim: rgba(91,156,246,0.12);
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.2);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ── NAV TABS ── */
    .nav-tabs {
      display: flex; gap: 0; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-strong);
      padding: 0 32px;
    }
    .nav-tabs a {
      display: inline-block; padding: 10px 24px; font-size: 13px; font-weight: 600;
      color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .nav-tabs a:hover { color: var(--text-strong); background: var(--primary-dim); }
    .nav-tabs a.active {
      color: var(--primary); border-bottom-color: var(--primary);
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-strong);
      padding: 12px 32px;
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(12px);
    }
    .header-left h1 { font-size: 16px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.3px; }
    .header-left p { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .theme-toggle, .update-btn {
      background: transparent; border: 1px solid var(--border-strong);
      border-radius: 6px; padding: 5px 12px; cursor: pointer;
      font-size: 13px; color: var(--text-muted); transition: all 0.15s;
    }
    .theme-toggle:hover, .update-btn:hover { background: var(--primary-dim); color: var(--primary); }

    /* ── LAYOUT ── */
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }
    .section { margin-bottom: var(--section-gap); }
    .section-title {
      font-size: 15px; font-weight: 700; color: var(--text-strong);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .section-title .badge {
      font-size: 11px; font-weight: 500; padding: 2px 8px;
      border-radius: 4px; background: var(--primary-dim); color: var(--primary);
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: var(--filter-bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filter-bar label { font-size: 12px; color: var(--text-muted); }
    .filter-bar select {
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 13px;
    }
    .filter-bar .filter-info { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    /* ── CARDS ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    /* ── KPI GRID ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 16px; text-align: center;
    }
    .kpi-card .kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .kpi-card .kpi-value { font-size: 24px; font-weight: 800; color: var(--text-strong); }
    .kpi-card .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .kpi-card .kpi-value.accent { color: var(--accent); }
    .kpi-card .kpi-value.success { color: var(--success); }
    .kpi-card .kpi-value.warning { color: var(--warning); }
    .kpi-card .kpi-value.primary { color: var(--primary); }

    /* ── FUNNEL BAR ── */
    .funnel-container { display: flex; flex-direction: column; gap: 8px; }
    .funnel-step { display: flex; align-items: center; gap: 12px; position: relative; }
    .funnel-step .step-label { width: 120px; font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; }
    .funnel-step .step-bar-wrap { flex: 1; height: 28px; background: var(--card-elevated); border-radius: 4px; position: relative; overflow: hidden; }
    .funnel-step .step-bar {
      height: 100%; border-radius: 4px; transition: width 0.5s ease;
      display: flex; align-items: center; padding-left: 8px;
      font-size: 12px; font-weight: 600; color: #fff;
    }
    .funnel-step .step-count { width: 80px; font-size: 13px; font-weight: 600; color: var(--text-strong); text-align: right; flex-shrink: 0; }
    .funnel-step .step-rate { width: 50px; font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; }
    .funnel-step.sub-step .step-label { font-size: 11px; padding-left: 16px; }
    .funnel-step.sub-step .step-bar-wrap { height: 22px; }

    /* ── FUNNEL TOOLTIP ── */
    .funnel-tooltip {
      display: none; position: absolute; left: 132px; bottom: 100%; z-index: 99999;
      background: var(--card-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25); min-width: 280px; max-width: 400px;
      max-height: 320px; overflow-y: auto; pointer-events: none;
    }
    .funnel-step:hover .funnel-tooltip { display: block; pointer-events: auto; }
    .funnel-tooltip h5 { font-size: 12px; font-weight: 700; color: var(--text-strong); margin-bottom: 8px; }
    .funnel-tooltip .tt-list { list-style: none; padding: 0; }
    .funnel-tooltip .tt-list li {
      font-size: 12px; color: var(--text); padding: 3px 0;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 8px;
    }
    .funnel-tooltip .tt-list li:last-child { border-bottom: none; }
    .funnel-tooltip .tt-corp { font-weight: 600; color: var(--text-strong); }
    .funnel-tooltip .tt-meta { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .funnel-tooltip .tt-count { font-size: 11px; color: var(--text-muted); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
    .funnel-tooltip::-webkit-scrollbar { width: 4px; }
    .funnel-tooltip::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
    .funnel-step.pinned .funnel-tooltip { display: block !important; pointer-events: auto !important; }
    .funnel-tooltip .pin-btn {
      position: absolute; top: 6px; right: 8px; cursor: pointer;
      font-size: 14px; opacity: 0.5; background: none; border: none; color: var(--text-muted);
    }
    .funnel-tooltip .pin-btn:hover { opacity: 1; }
    .funnel-step.pinned .funnel-tooltip .pin-btn { opacity: 1; color: var(--primary); }
    @media (max-width: 600px) { .funnel-tooltip { left: 0; min-width: 220px; max-width: 90vw; max-height: 260px; font-size: 11px; } }

    /* ── TABLE ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      background: var(--card-elevated); color: var(--text-muted);
      font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-strong);
      position: sticky; top: 0; z-index: 1;
    }
    .data-table td {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .data-table tr:hover td { background: var(--primary-dim); }
    .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .data-table .highlight { color: var(--primary); font-weight: 600; }
    .data-table .danger { color: var(--accent); }
    .data-table .success-text { color: var(--success); }
    .data-table .muted { color: var(--text-muted); }
    .data-table .total-row td { font-weight: 700; background: var(--filter-bg); border-top: 2px solid var(--border-strong); }

    /* ── CHART WRAPPER ── */
    .chart-wrap { position: relative; height: 300px; }
    .chart-wrap canvas { width: 100% !important; }

    /* ── GRID LAYOUTS ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .container { padding: 16px; }
      header { padding: 10px 16px; }
      .nav-tabs { padding: 0 16px; }
      .filter-bar { padding: 8px 12px; gap: 8px; }
    }

    /* ── TAB BTN ── */
    .tab-btn {
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 4px; padding: 4px 12px; cursor: pointer;
      font-size: 12px; color: var(--text-muted); transition: all 0.15s;
    }
    .tab-btn:hover { background: var(--primary-dim); color: var(--primary); }

    /* ── COLLAPSIBLE ── */
    .collapse-toggle {
      cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
    }
    .collapse-toggle .arrow { transition: transform 0.2s; display: inline-block; }
    .collapse-toggle.open .arrow { transform: rotate(90deg); }
    .collapse-body { display: none; }
    .collapse-body.open { display: block; }

    /* ── SLA ── */
    .sla-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .sla-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px; text-align: center;
    }
    .sla-card .sla-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .sla-card .sla-value { font-size: 20px; font-weight: 700; color: var(--text-strong); }
    .sla-card .sla-unit { font-size: 11px; color: var(--text-muted); }

    /* ── PRINT ── */
    @media print {
      header, .filter-bar, .update-btn, .theme-toggle, .nav-tabs, footer,
      .tab-btn, button { break-inside: avoid; }
      body { background: #fff; color: #111; font-size: 11px; }
      .container { max-width: none; padding: 8px; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }

    /* ── FOOTER ── */
    footer { text-align: center; padding: 24px; font-size: 11px; color: var(--text-muted); }

    /* ── MOBILE ENHANCEMENTS ── */
    @media (max-width: 768px) {
      /* Collapsible filter bar */
      .filter-bar {
        flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px;
      }
      .filter-bar .filter-row {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      }
      .filter-bar select, .filter-bar input[type="date"] {
        font-size: 16px !important; /* Prevents iOS zoom */
        min-height: 36px; padding: 6px 8px;
      }
      .filter-bar .tab-btn {
        min-height: 36px; min-width: 44px; /* Touch target */
      }
      /* Better KPI on mobile */
      .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
      .kpi-card { padding: 12px !important; }
      .kpi-card .kpi-value { font-size: 20px !important; }
      /* Funnel touch targets */
      .funnel-step { min-height: 36px; }
      .funnel-step .step-label { width: 80px !important; font-size: 11px !important; }
      /* SLA grid mobile */
      .sla-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px; }
      .sla-card { padding: 10px; }
      .sla-card .sla-value { font-size: 16px; }
      /* Better table scroll indicator */
      .table-scroll, [style*="overflow-x"] {
        position: relative;
      }
      .table-scroll::after, [style*="overflow-x"]::after {
        content: '← 스크롤 →'; position: absolute; bottom: 4px; right: 8px;
        font-size: 10px; color: var(--text-muted); opacity: 0.6;
        pointer-events: none;
      }
      /* Section padding */
      .section { margin-bottom: 20px; }
      .container { padding: 12px !important; }
      /* Embedded mode: extra bottom padding for bottom tab bar */
      body.embedded { padding-bottom: 64px; }
    }
  </style>
</head>
<body>

<!-- ── NAV TABS ── -->
<div class="nav-tabs" id="navTabsLocal">
  <a href="card_funnel_dashboard.html" class="active">신규 입회 퍼널</a>
  <a href="limit_increase_dashboard.html">한도상향 퍼널</a>
</div>
<script>
  // 임베디드 모드: 부모 래퍼에서 로드 시 nav-tabs 숨김
  if (window.location.search.includes('embedded=1')) {
    document.getElementById('navTabsLocal').style.display = 'none';
    document.body.classList.add('embedded');
  }
</script>

<header>
  <div class="header-left">
    <h1>신규 입회 퍼널 대시보드 <span style="font-size:11px;font-weight:400;color:var(--text-muted)">V1.0</span></h1>
    <p>mart_limit_application.card_application_funnel | 업데이트: 2026-03-12 | <span id="freshness" style="font-weight:500"></span></p>
  </div>
  <div class="header-right">
    <button class="update-btn" onclick="window.print()">PDF 내보내기</button>
    <button class="theme-toggle" onclick="toggleTheme()">라이트/다크</button>
  </div>
</header>

<div class="container">

  <!-- ── FILTER BAR ── -->
  <div class="filter-bar">
    <button class="tab-btn" onclick="quickFilter(7)" style="padding:2px 8px;font-size:11px">7일</button>
    <button class="tab-btn" onclick="quickFilter(30)" style="padding:2px 8px;font-size:11px">30일</button>
    <button class="tab-btn" onclick="quickFilter(90)" style="padding:2px 8px;font-size:11px">90일</button>
    <button class="tab-btn" onclick="quickFilter(0)" style="padding:2px 8px;font-size:11px">전체</button>
    <span style="display:inline-flex;border:1px solid var(--border-strong);border-radius:4px;overflow:hidden;margin-left:4px">
      <button class="tab-btn date-mode active" onclick="setDateMode('submit',this)" style="border:none;border-radius:0;font-size:11px;padding:2px 10px">신청일</button>
      <button class="tab-btn date-mode" onclick="setDateMode('issued',this)" style="border:none;border-radius:0;font-size:11px;padding:2px 10px">발급일</button>
    </span>
    <label>기간</label>
    <input type="date" id="filterStart" style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px">
    <span style="color:var(--text-muted)">~</span>
    <input type="date" id="filterEnd" style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px">
    <label style="margin-left:16px">담당자</label>
    <select id="filterAM" onchange="applyFilter()"><option value="">전체</option></select>
    <button class="tab-btn" onclick="applyFilter()" style="padding:4px 12px">적용</button>
    <span class="filter-info" id="filterInfo"></span>
  </div>

  <!-- ── RISK ALERTS ── -->
  <div id="alertPanel" style="margin-bottom:16px"></div>

  <!-- ── KPI SUMMARY ── -->
  <div class="section">
    <div class="section-title">핵심 지표 <span class="badge" id="periodBadge">전체 기간</span></div>
    <div class="kpi-grid" id="kpiGrid"></div>
  </div>

  <!-- ── FUNNEL VISUAL ── -->
  <div class="section">
    <div class="section-title">발급 퍼널 단계별 현황 <span class="badge">합산</span></div>
    <div class="card">
      <div class="funnel-container" id="funnelVisual"></div>
    </div>
  </div>

  <!-- ── MONTHLY TREND (INDEPENDENT) ── -->
  <div class="section">
    <div class="section-title">월별 전환율 트렌드 <span class="badge">필터 독립</span></div>
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--text-muted);white-space:nowrap">비교 월:</span>
        <select id="monthSelect" multiple onchange="onMonthSelectChange()" style="min-width:200px;max-width:100%;height:32px;font-size:12px;padding:2px 6px;border:1px solid var(--border-strong);border-radius:4px;background:var(--card);color:var(--text)"></select>
        <button class="tab-btn" onclick="selectAllMonths()" style="font-size:10px;padding:2px 6px">전체</button>
        <button class="tab-btn" onclick="selectRecentMonths(3)" style="font-size:10px;padding:2px 6px">최근 3개월</button>
        <button class="tab-btn" onclick="selectRecentMonths(6)" style="font-size:10px;padding:2px 6px">최근 6개월</button>
        <span id="monthSelectInfo" style="font-size:11px;color:var(--text-muted);margin-left:auto"></span>
      </div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <!-- ── DAILY TREND (FOLLOWS TOP FILTER) ── -->
  <div class="section">
    <div class="section-title">일별 전환율 트렌드 <span class="badge" id="dailyPeriodBadge">상단 필터 연동</span></div>
    <div class="card">
      <div class="chart-wrap" style="height:280px"><canvas id="dailyTrendChart"></canvas></div>
    </div>
  </div>

  <!-- ── MONTHLY TABLE ── -->
  <div class="section">
    <div class="section-title collapse-toggle" onclick="toggleCollapse(this)">
      <span class="arrow">▶</span> 월별 상세 테이블
    </div>
    <div class="collapse-body" id="monthlyTableWrap">
      <div class="card" style="overflow-x:auto">
        <table class="data-table" id="monthlyTable"></table>
      </div>
    </div>
  </div>

  <!-- ── SLA ── -->
  <div class="section">
    <div class="section-title">SLA (평균 소요일)</div>
    <div class="sla-grid" id="slaGrid"></div>
  </div>

  <!-- ── AM TABLE ── -->
  <div class="section">
    <div class="section-title collapse-toggle" onclick="toggleCollapse(this)">
      <span class="arrow">▶</span> AM 담당자별 퍼널
    </div>
    <div class="collapse-body" id="amTableWrap">
      <div class="card" style="overflow-x:auto">
        <table class="data-table" id="amTable"></table>
      </div>
    </div>
  </div>

</div>

<footer>
  GoWid 신규 입회 퍼널 대시보드 &middot; 데이터 자동 갱신
</footer>

const DATA_UPDATED_AT = '2026-03-12T05:00:02.508Z';

// ─── THEME ───
function toggleTheme() {
  document.documentElement.classList.toggle('dark-mode');
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  // 부모 래퍼에 테마 변경 알림
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'themeChange', dark: isDark }, '*');
  }
}
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.classList.add('dark-mode');
  document.body.classList.add('dark-mode');
}

// ─── COLLAPSIBLE ───
function toggleCollapse(el) {
  el.classList.toggle('open');
  const body = el.nextElementSibling;
  body.classList.toggle('open');
}

// ─── FRESHNESS ───
function renderFreshness() {
  const el = document.getElementById('freshness');
  if (!DATA_UPDATED_AT || !el) return;
  const diff = Date.now() - new Date(DATA_UPDATED_AT).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) el.textContent = `${mins}분 전`;
  else if (mins < 1440) el.textContent = `${Math.floor(mins / 60)}시간 전`;
  else el.textContent = `${Math.floor(mins / 1440)}일 전`;
}

// ─── DATE MODE (신청일 / 발급일) ───
let dateMode = 'submit'; // 'submit' or 'issued'

function setDateMode(mode, btn) {
  dateMode = mode;
  document.querySelectorAll('.date-mode').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function getRecordDate(r) {
  return dateMode === 'issued' ? r.id : r.d;
}

function resetDateRange() {
  const dates = RECORD_DATA.map(r => getRecordDate(r)).filter(Boolean).sort();
  if (dates.length > 0) {
    document.getElementById('filterStart').value = dates[0];
    document.getElementById('filterEnd').value = dates[dates.length - 1];
  }
}

// ─── FILTER ───
function getFilteredRecords() {
  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;
  const am = document.getElementById('filterAM').value;
  return RECORD_DATA.filter(r => {
    const dt = getRecordDate(r);
    if (dateMode === 'issued' && !dt) return false; // 발급일 모드에서 미발급 건 제외
    if (start && dt < start) return false;
    if (end && dt > end) return false;
    if (am && r.am !== am) return false;
    return true;
  });
}

function aggregateFunnel(records) {
  const t = { sub:0, apr:0, sig:0, ls:0, lp:0, lr:0, lnz:0, lz:0, ci:0, ca:0, cd:0, fs:0 };
  for (const r of records) {
    t.sub += r.sub; t.apr += r.apr; t.sig += r.sig;
    t.ls += r.ls; t.lp += r.lp; t.lr += r.lr;
    t.lnz += r.lnz; t.lz += r.lz;
    t.ci += r.ci; t.ca += r.ca; t.cd += r.cd; t.fs += r.fs;
  }
  return t;
}

function aggregateSLA(records) {
  const sums = { d1:0, d2:0, d3:0, d4:0, dt:0, d5:0 };
  const cnts = { d1:0, d2:0, d3:0, d4:0, dt:0, d5:0 };
  for (const r of records) {
    for (const k of ['d1','d2','d3','d4','dt','d5']) {
      if (r[k] != null) { sums[k] += r[k]; cnts[k]++; }
    }
  }
  const avg = {};
  for (const k of ['d1','d2','d3','d4','dt','d5']) {
    avg[k] = cnts[k] > 0 ? Math.round(sums[k] / cnts[k] * 10) / 10 : null;
  }
  return avg;
}

function pct(num, den) {
  if (!den || den === 0) return 0;
  return Math.round((num / den) * 1000) / 10;
}

function quickFilter(days) {
  if (days === 0) {
    resetDateRange();
  } else {
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - days);
    document.getElementById('filterStart').value = start.toISOString().slice(0, 10);
    document.getElementById('filterEnd').value = end.toISOString().slice(0, 10);
  }
  applyFilter();
}

function applyFilter() {
  const records = getFilteredRecords();
  const funnel = aggregateFunnel(records);
  const sla = aggregateSLA(records);

  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;
  const modeLabel = dateMode === 'issued' ? '발급일' : '신청일';
  document.getElementById('filterInfo').textContent = `${modeLabel} 기준 ${records.length}건 / ${RECORD_DATA.length}건`;
  document.getElementById('periodBadge').textContent = (start && end ? `${start} ~ ${end}` : '전체 기간') + ` (${modeLabel})`;

  buildKPIs(funnel);
  buildAlerts(records);
  buildFunnel(funnel);
  buildMonthlyTrend();
  buildDailyTrend(records);
  buildMonthlyTable(records);
  buildSLA(sla);
  buildAMTable(records);
}

// ─── XSS ESCAPE ───
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── RISK ALERTS ───
function buildAlerts(records) {
  const today = new Date();
  const daysDiff = (d) => Math.floor((today - new Date(d)) / 86400000);

  const alerts = [];

  // Check all records (not just filtered)
  RECORD_DATA.forEach(r => {
    const days = daysDiff(r.d);
    if (r.apr && !r.sig && days > 7) {
      alerts.push({ type: 'danger', label: '승인 후 미가입', corp: r.c, am: r.am || '-', days: days, date: r.d });
    }
    if (r.lnz && !r.cd && days > 14) {
      alerts.push({ type: 'danger', label: '유효한도 후 미발급', corp: r.c, am: r.am || '-', days: days, date: r.d });
    }
    if (r.cd && !r.fs && days > 30) {
      alerts.push({ type: 'warning', label: '발급 후 미사용', corp: r.c, am: r.am || '-', days: days, date: r.d });
    }
  });

  const panel = document.getElementById('alertPanel');
  if (alerts.length === 0) {
    panel.innerHTML = '<div style="background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--success);font-weight:600">모든 고객이 정상 진행 중입니다</div>';
    return;
  }

  const dangers = alerts.filter(a => a.type === 'danger');
  const warnings = alerts.filter(a => a.type === 'warning');

  let html = '<div style="background:rgba(240,96,96,0.08);border:1px solid rgba(240,96,96,0.25);border-radius:8px;padding:16px;margin-bottom:8px">';
  html += '<div style="font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px">⚠ 주의 필요 — ' + dangers.length + '건 위험, ' + warnings.length + '건 주의</div>';

  // Show danger alerts (max 10)
  if (dangers.length > 0) {
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
    dangers.slice(0, 10).forEach(a => {
      html += '<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(240,96,96,0.15);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--accent)">';
      html += esc(a.corp) + ' <span style="font-weight:400;color:var(--text-muted)">' + esc(a.label) + ' ' + a.days + '일</span>';
      html += ' <span style="font-size:10px;color:var(--text-muted)">[' + esc(a.am) + ']</span></span>';
    });
    if (dangers.length > 10) html += '<span style="font-size:11px;color:var(--text-muted);padding:4px 8px">외 ' + (dangers.length - 10) + '건</span>';
    html += '</div>';
  }

  // Show warning alerts (max 5, collapsed)
  if (warnings.length > 0) {
    html += '<details style="margin-top:4px"><summary style="font-size:12px;color:var(--text-muted);cursor:pointer">발급 후 미사용 ' + warnings.length + '건</summary>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">';
    warnings.slice(0, 20).forEach(a => {
      html += '<span style="display:inline-block;background:rgba(251,191,36,0.15);border-radius:4px;padding:3px 8px;font-size:11px;color:#b45309">';
      html += esc(a.corp) + ' (' + a.days + '일) [' + esc(a.am) + ']</span>';
    });
    if (warnings.length > 20) html += '<span style="font-size:11px;color:var(--text-muted)">외 ' + (warnings.length - 20) + '건</span>';
    html += '</div></details>';
  }
  html += '</div>';

  panel.innerHTML = html;
}

// ─── KPIs ───
function buildKPIs(t) {
  const convRate = pct(t.cd, t.sub);
  const approveRate = pct(t.apr, t.sub);
  const limitValidRate = pct(t.lnz, t.lr);

  // 병목 분석
  const bottlenecks = [
    { label: '신청→승인', drop: t.sub - t.apr, base: t.sub },
    { label: '승인→가입', drop: t.apr - t.sig, base: t.apr },
    { label: '가입→한도산출', drop: t.sig - t.lr, base: t.sig },
    { label: '한도산출→유효', drop: t.lz, base: t.lr },
    { label: '유효→발급신청', drop: t.lnz - t.ca, base: t.lnz },
    { label: '발급신청→발급', drop: t.ca - t.cd, base: t.ca },
  ];
  const maxBottleneck = bottlenecks.reduce((a, b) => {
    const aP = a.base > 0 ? a.drop / a.base : 0;
    const bP = b.base > 0 ? b.drop / b.base : 0;
    return bP > aP ? b : a;
  });

  const convClass = convRate >= 30 ? 'success' : convRate >= 20 ? 'warning' : 'accent';
  const aprClass = approveRate >= 85 ? 'success' : approveRate >= 70 ? 'warning' : 'accent';
  const limClass = limitValidRate >= 60 ? 'success' : limitValidRate >= 40 ? 'warning' : 'accent';

  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">신규입회 전환율 (신청→발급)</div>
      <div class="kpi-value ${convClass}">${convRate}%</div>
      <div class="kpi-sub">${t.cd.toLocaleString()} / ${t.sub.toLocaleString()}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">최대 병목 구간</div>
      <div class="kpi-value accent" style="font-size:16px">${maxBottleneck.label}</div>
      <div class="kpi-sub">${maxBottleneck.drop}건 이탈 (${pct(maxBottleneck.drop, maxBottleneck.base)}%)</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">도입신청서 승인율</div>
      <div class="kpi-value ${aprClass}">${approveRate}%</div>
      <div class="kpi-sub">${t.apr.toLocaleString()} / ${t.sub.toLocaleString()}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">한도산출 유효율</div>
      <div class="kpi-value ${limClass}">${limitValidRate}%</div>
      <div class="kpi-sub">${t.lnz.toLocaleString()} / ${t.lr.toLocaleString()}</div>
    </div>
  `;
}

// ─── TOOLTIP PIN ───
function togglePin(e) {
  e.stopPropagation();
  const step = e.target.closest('.funnel-step');
  step.classList.toggle('pinned');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.funnel-step')) {
    document.querySelectorAll('.funnel-step.pinned').forEach(el => el.classList.remove('pinned'));
  }
});

// ─── FUNNEL VISUAL ───
function buildFunnel(t) {
  const recs = getFilteredRecords();

  function stepTooltip(items, title) {
    if (items.length === 0) return '';
    const shown = items.slice(0, 30);
    let list = shown.map(r =>
      '<li><span class="tt-corp">' + r.c + '</span><span class="tt-meta">' + (r.am || '-') + ' | ' + r.d + '</span></li>'
    ).join('');
    const more = items.length > 30 ? '<div class="tt-count">외 ' + (items.length - 30) + '건 더</div>' : '';
    return '<div class="funnel-tooltip"><button class="pin-btn" onclick="togglePin(event)">📌</button><h5>' + title + ' (' + items.length + '건)</h5><ul class="tt-list">' + list + '</ul>' + more + '</div>';
  }

  const stepDefs = [
    { label: '도입신청서 제출', count: t.sub, color: '#5b9cf6', filter: r => r.sub },
    { label: '승인', count: t.apr, color: '#6ba3f7', filter: r => r.apr },
    { label: '회원가입', count: t.sig, color: '#7caaf8', filter: r => r.sig },
    { label: '한도조회 시작', count: t.ls, color: '#818cf8', filter: r => r.ls },
    { label: '한도조회 진행', count: t.lp, color: '#8b8cf8', filter: r => r.lp },
    { label: '한도산출 완료', count: t.lr, color: '#9b8cf8', filter: r => r.lr },
    { label: '  유효 (0원 초과)', count: t.lnz, color: '#34d399', sub: true, filter: r => r.lnz },
    { label: '  0원', count: t.lz, color: '#f06060', sub: true, filter: r => r.lz },
    { label: '카드정보 입력', count: t.ci, color: '#60a5fa', filter: r => r.ci },
    { label: '발급신청 완료', count: t.ca, color: '#3b82f6', filter: r => r.ca },
    { label: '카드발급 완료', count: t.cd, color: '#2563eb', filter: r => r.cd },
  ];

  const max = t.sub || 1;
  const el = document.getElementById('funnelVisual');
  el.innerHTML = stepDefs.map(s => {
    const filtered = recs.filter(s.filter);
    const barPct = Math.max(s.count / max * 100, 0.5);
    return `
    <div class="funnel-step ${s.sub ? 'sub-step' : ''}">
      <div class="step-label">${s.label}</div>
      <div class="step-bar-wrap">
        <div class="step-bar" style="width:${barPct}%;background:${s.color}"></div>
      </div>
      <div class="step-count">${s.count.toLocaleString()}</div>
      <div class="step-rate">${pct(s.count, max)}%</div>
      ${stepTooltip(filtered, s.label.trim() + ' 고객')}
    </div>`;
  }).join('');
}

// ─── DAILY TREND (follows top filter) ───
let dailyTrendChartInstance = null;

function buildDailyTrend(records) {
  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;
  document.getElementById('dailyPeriodBadge').textContent = start + ' ~ ' + end;

  // Group by date
  const dateMap = {};
  records.forEach(r => {
    const dt = getRecordDate(r);
    if (!dt) return;
    if (!dateMap[dt]) dateMap[dt] = [];
    dateMap[dt].push(r);
  });

  // Fill missing dates in range
  const dates = [];
  const d = new Date(start);
  const endDate = new Date(end);
  while (d <= endDate) {
    dates.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }

  const dailyData = dates.map(dt => {
    const recs = dateMap[dt] || [];
    const f = aggregateFunnel(recs);
    return {
      date: dt,
      label: dt.slice(5),
      count: f.sub,
      conv: pct(f.cd, f.sub),
      limValid: pct(f.lnz, f.lr),
    };
  });

  if (dailyTrendChartInstance) dailyTrendChartInstance.destroy();
  const ctx = document.getElementById('dailyTrendChart').getContext('2d');
  dailyTrendChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dailyData.map(d => d.label),
      datasets: [
        {
          label: '일별 신청',
          data: dailyData.map(d => d.count),
          type: 'bar',
          backgroundColor: 'rgba(91,156,246,0.3)',
          borderColor: 'rgba(91,156,246,0.5)',
          borderWidth: 1,
          order: 2,
          yAxisID: 'y1',
        },
        {
          label: '전환율 (7일 이동평균)',
          data: movingAverage(dailyData.map(d => d.conv), 7),
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.08)',
          fill: true, tension: 0.3, borderWidth: 2, pointRadius: 0, order: 1,
        },
        {
          label: '유효율 (7일 이동평균)',
          data: movingAverage(dailyData.map(d => d.limValid), 7),
          borderColor: '#34d399',
          backgroundColor: 'rgba(52,211,153,0.08)',
          fill: true, tension: 0.3, borderWidth: 2, pointRadius: 0, order: 1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 }, usePointStyle: true, pointStyle: 'circle' } },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.dataset.yAxisID === 'y1') return ctx.dataset.label + ': ' + ctx.parsed.y + '건';
              return ctx.dataset.label + ': ' + (ctx.parsed.y != null ? ctx.parsed.y.toFixed(1) : '-') + '%';
            }
          }
        },
      },
      scales: {
        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.06)' } },
        y1: { position: 'right', beginAtZero: true, ticks: { font: { size: 10 } }, grid: { display: false } },
        x: { ticks: { font: { size: 9 }, maxRotation: 45 }, grid: { display: false } },
      },
    },
  });
}

function movingAverage(arr, window) {
  return arr.map((_, i) => {
    const start = Math.max(0, i - window + 1);
    const slice = arr.slice(start, i + 1).filter(v => v != null && v > 0);
    if (slice.length === 0) return null;
    return Math.round(slice.reduce((a, b) => a + b, 0) / slice.length * 10) / 10;
  });
}

// ─── MONTHLY TREND (independent from top filter, uses ALL data) ───
let trendChartInstance = null;
let selectedMonths = new Set();

function initMonthSelect() {
  // Generate all months from 2025-01 to current month
  const allMonths = [];
  const now = new Date();
  const d = new Date(2025, 0, 1);
  while (d <= now) {
    allMonths.push(d.toISOString().slice(0, 7));
    d.setMonth(d.getMonth() + 1);
  }

  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  allMonths.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m.slice(2).replace('-', '년 ') + '월';
    opt.selected = true;
    sel.appendChild(opt);
  });
  selectedMonths = new Set(allMonths);
  updateMonthInfo();
}

function onMonthSelectChange() {
  const sel = document.getElementById('monthSelect');
  selectedMonths = new Set([...sel.options].filter(o => o.selected).map(o => o.value));
  updateMonthInfo();
  buildMonthlyTrend();
}

function selectAllMonths() {
  const sel = document.getElementById('monthSelect');
  [...sel.options].forEach(o => o.selected = true);
  selectedMonths = new Set([...sel.options].map(o => o.value));
  updateMonthInfo();
  buildMonthlyTrend();
}

function selectRecentMonths(n) {
  const sel = document.getElementById('monthSelect');
  const opts = [...sel.options];
  opts.forEach(o => o.selected = false);
  opts.slice(-n).forEach(o => o.selected = true);
  selectedMonths = new Set(opts.filter(o => o.selected).map(o => o.value));
  updateMonthInfo();
  buildMonthlyTrend();
}

function updateMonthInfo() {
  const total = document.getElementById('monthSelect').options.length;
  document.getElementById('monthSelectInfo').textContent = selectedMonths.size + '/' + total + '개월 선택';
}

function buildMonthlyTrend() {
  // Use ALL RECORD_DATA, not filtered records
  const monthMap = {};
  RECORD_DATA.forEach(r => {
    const dt = getRecordDate(r);
    if (!dt) return;
    const m = dt.slice(0, 7);
    if (!selectedMonths.has(m)) return;
    if (!monthMap[m]) monthMap[m] = [];
    monthMap[m].push(r);
  });

  const months = Object.keys(monthMap).sort();
  const data = months.map(m => {
    const f = aggregateFunnel(monthMap[m]);
    return {
      label: m,
      conv: pct(f.cd, f.sub),
      limValid: pct(f.lnz, f.lr),
      firstSpend: pct(f.fs, f.cd),
    };
  });

  if (trendChartInstance) trendChartInstance.destroy();
  const ctx = document.getElementById('trendChart').getContext('2d');
  trendChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [
        { label: '신청→발급 전환율', data: data.map(d => d.conv), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.3, borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: '#3b82f6' },
        { label: '한도산출 유효율', data: data.map(d => d.limValid), borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,0.1)', fill: true, tension: 0.3, borderWidth: 2, pointRadius: 3 },
        { label: '발급→첫결제율', data: data.map(d => d.firstSpend), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', fill: true, tension: 0.3, borderWidth: 2, pointRadius: 3 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 }, usePointStyle: true, pointStyle: 'circle' } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}%` } },
      },
      scales: {
        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.06)' } },
        x: { ticks: { font: { size: 11 } }, grid: { display: false } },
      },
    },
  });
}

// ─── MONTHLY TABLE ───
function buildMonthlyTable(records) {
  const monthMap = {};
  for (const r of records) {
    const dt = getRecordDate(r);
    if (!dt) continue;
    const m = dt.slice(0, 7);
    if (!monthMap[m]) monthMap[m] = [];
    monthMap[m].push(r);
  }
  const months = Object.keys(monthMap).sort();
  const total = aggregateFunnel(records);

  const cols = [
    { key: 'sub', label: '제출' },
    { key: 'apr', label: '승인' },
    { key: 'sig', label: '가입' },
    { key: 'lr', label: '한도산출' },
    { key: 'lnz', label: '유효' },
    { key: 'lz', label: '0원' },
    { key: 'ci', label: '카드정보' },
    { key: 'ca', label: '발급신청' },
    { key: 'cd', label: '발급완료' },
    { key: 'fs', label: '첫결제' },
  ];

  let html = '<thead><tr><th>월</th>';
  cols.forEach(c => html += `<th class="num">${c.label}</th>`);
  html += '<th class="num">전환율 (MoM)</th><th class="num">승인율</th><th class="num">유효율</th></tr></thead><tbody>';

  let prevConv = null;
  for (const m of months) {
    const f = aggregateFunnel(monthMap[m]);
    const conv = pct(f.cd, f.sub);
    const momDelta = (prevConv !== null && conv > 0) ? conv - prevConv : null;
    const momHtml = momDelta !== null ? (momDelta >= 0
      ? ' <span style="color:var(--success);font-size:10px">▲' + Math.abs(momDelta).toFixed(1) + '</span>'
      : ' <span style="color:var(--accent);font-size:10px">▼' + Math.abs(momDelta).toFixed(1) + '</span>') : '';
    prevConv = conv;
    const aprRate = pct(f.apr, f.sub);
    const limRate = pct(f.lnz, f.lr);
    html += `<tr><td>${m}</td>`;
    cols.forEach(c => {
      const v = f[c.key];
      const cls = c.key === 'lz' ? 'num danger' : 'num';
      html += `<td class="${cls}">${v.toLocaleString()}</td>`;
    });
    html += `<td class="num highlight">${conv}%${momHtml}</td>`;
    html += `<td class="num muted">${aprRate}%</td>`;
    html += `<td class="num ${limRate >= 50 ? 'success-text' : 'danger'}">${limRate}%</td>`;
    html += '</tr>';
  }

  html += '<tr class="total-row"><td>합계</td>';
  cols.forEach(c => {
    const cls = c.key === 'lz' ? 'num danger' : 'num';
    html += `<td class="${cls}">${total[c.key].toLocaleString()}</td>`;
  });
  html += `<td class="num highlight">${pct(total.cd, total.sub)}%</td>`;
  html += `<td class="num muted">${pct(total.apr, total.sub)}%</td>`;
  html += `<td class="num">${pct(total.lnz, total.lr)}%</td>`;
  html += '</tr></tbody>';

  document.getElementById('monthlyTable').innerHTML = html;
}

// ─── AM TABLE ───
function buildAMTable(records) {
  const amMap = {};
  for (const r of records) {
    const am = r.am || '(미배정)';
    if (am === '옥래협') continue;
    if (!amMap[am]) amMap[am] = [];
    amMap[am].push(r);
  }

  const ams = Object.keys(amMap).sort((a, b) => amMap[b].length - amMap[a].length);
  if (ams.length === 0) {
    document.getElementById('amTable').innerHTML = '<tbody><tr><td>데이터 없음</td></tr></tbody>';
    return;
  }

  let html = '<thead><tr><th>AM</th><th class="num">제출</th><th class="num">승인</th><th class="num">가입</th>';
  html += '<th class="num">한도산출</th><th class="num">유효</th><th class="num">발급</th>';
  html += '<th class="num">전환율</th><th class="num">유효율</th></tr></thead><tbody>';

  for (const am of ams) {
    const f = aggregateFunnel(amMap[am]);
    html += `<tr>
      <td>${am}</td>
      <td class="num">${f.sub.toLocaleString()}</td>
      <td class="num">${f.apr.toLocaleString()}</td>
      <td class="num">${f.sig.toLocaleString()}</td>
      <td class="num">${f.lr.toLocaleString()}</td>
      <td class="num">${f.lnz.toLocaleString()}</td>
      <td class="num">${f.cd.toLocaleString()}</td>
      <td class="num highlight">${pct(f.cd, f.sub)}%</td>
      <td class="num ${pct(f.lnz, f.lr) >= 50 ? 'success-text' : 'danger'}">${pct(f.lnz, f.lr)}%</td>
    </tr>`;
  }
  html += '</tbody>';
  document.getElementById('amTable').innerHTML = html;
}

// ─── INIT ───
function init() {
  renderFreshness();

  // AM 드롭다운 채우기
  const amSet = new Set(RECORD_DATA.map(r => r.am).filter(a => a && a !== '옥래협'));
  const amSelect = document.getElementById('filterAM');
  [...amSet].sort().forEach(am => {
    const opt = document.createElement('option');
    opt.value = am; opt.textContent = am;
    amSelect.appendChild(opt);
  });

  // URL 파라미터
  const urlP = new URLSearchParams(location.search);
  if (urlP.get('mode') === 'issued') {
    dateMode = 'issued';
    document.querySelectorAll('.date-mode').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.date-mode')[1].classList.add('active');
  }

  // 날짜 범위 초기화: 당월 기본값
  if (urlP.get('start')) {
    document.getElementById('filterStart').value = urlP.get('start');
  } else {
    const now = new Date();
    document.getElementById('filterStart').value = now.toISOString().slice(0, 8) + '01';
  }
  if (urlP.get('end')) {
    document.getElementById('filterEnd').value = urlP.get('end');
  } else {
    document.getElementById('filterEnd').value = new Date().toISOString().slice(0, 10);
  }
  if (urlP.get('am')) document.getElementById('filterAM').value = urlP.get('am');

  // date input change 이벤트
  document.getElementById('filterStart').addEventListener('change', applyFilter);
  document.getElementById('filterEnd').addEventListener('change', applyFilter);

  initMonthSelect();
  applyFilter();

  // Auto-refresh every 30 minutes
  if (window.location.search.includes('embedded=1')) {
    setInterval(() => { applyFilter(); }, 30 * 60 * 1000);
  }
}

document.addEventListener('DOMContentLoaded', init);
