name: Update Dashboard Data

on:
  schedule:
    # 매일 한국시간 오전 7시 ~ 오후 11시, 매시간 (UTC 22~23, 0~14시)
    # :07 분 오프셋 — GitHub 호스티드 러너 정각 큐 혼잡 회피
    - cron: '7 22-23,0-14 * * *'
  workflow_dispatch: # 수동 실행도 가능

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write BigQuery credentials
        run: |
          mkdir -p $HOME/.claude/credentials
          printenv BIGQUERY_KEY_JSON > $HOME/.claude/credentials/gowid-prd-bigquery-key.json
        env:
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}

      - name: Update card issuance dashboard
        run: node update_data.js
        env:
          SKIP_DEPLOY: '1'

      - name: Update limit increase dashboard
        run: node update_limit_data.js
        env:
          SKIP_DEPLOY: '1'

      - name: Update card funnel dashboard
        run: node update_card_funnel_data.js
        env:
          SKIP_DEPLOY: '1'

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card_issuance_dashboard.html limit_increase_dashboard.html card_funnel_dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily data update $(date +%Y-%m-%d)"
          # 같은 시각에 다른 워크플로가 먼저 push하면 거절된다(2026-10-19 15:00) → 최신 main 위로 올려서 재시도
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase -q origin main
          done
          exit 1
