name: Update Dashboard Data

on:
  schedule:
    # 매일 한국시간 오전 7시 ~ 오후 11시, 매시간 (UTC 22~23, 0~14시)
    - cron: '0 22-23,0-14 * * *'
  workflow_dispatch: # 수동 실행도 가능

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write BigQuery credentials
        run: |
          mkdir -p $HOME/.claude/credentials
          printenv BIGQUERY_KEY_JSON > $HOME/.claude/credentials/gowid-prd-bigquery-key.json
        env:
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}

      - name: Update card issuance dashboard
        run: node update_data.js
        env:
          SKIP_DEPLOY: '1'

      - name: Update limit increase dashboard
        run: node update_limit_data.js
        env:
          SKIP_DEPLOY: '1'

      - name: Update card funnel dashboard
        run: node update_card_funnel_data.js
        env:
          SKIP_DEPLOY: '1'

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card_issuance_dashboard.html limit_increase_dashboard.html card_funnel_dashboard.html
          git diff --cached --quiet || (git commit -m "chore: daily data update $(date +%Y-%m-%d)" && git push)
