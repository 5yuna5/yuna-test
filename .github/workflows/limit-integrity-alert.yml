name: Limit Integrity Alert

# 한도 정합성 알럿 — 보증금(계약=입금=한도) / 발급(승인=현재) 대조 → 시트 갱신 + 슬랙 요약
# 1차는 맥 launchd 09:00(슬랙 전체 검색, 15~20분 소요). GHA는 사용자 토큰이 없어 사유를 덜 찾으므로 KST 10시 이후 폴백 전용 —
# 오늘 알림이 이미 있으면 시트·슬랙 모두 건드리지 않는다 (index.js 가드).
# 슬랙 중복 발송은 index.js 멱등성 가드가 막고, 시트 갱신은 몇 번 돌아도 결과 동일.

on:
  schedule:
    - cron: '5 1 * * *'    # KST 10:05 (폴백: 맥이 꺼져 9시 로컬 실행을 놓친 날만)
    - cron: '35 1 * * *'   # KST 10:35
    - cron: '5 2 * * *'    # KST 11:05
  workflow_run:
    workflows: ["Update Dashboard Data"]
    types: [completed]
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Time window guard (workflow_run only)
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HOUR=$(date -u +%H)
            case "$HOUR" in
              01|02|03) echo "proceed=true" >> $GITHUB_OUTPUT ;;
              *) echo "proceed=false" >> $GITHUB_OUTPUT; echo "outside KST 10-13 fallback window (UTC=$HOUR), skip" ;;
            esac
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.window.outputs.proceed == 'true'
        working-directory: ops/limit-integrity-alert
        run: npm install

      - name: Write BigQuery credentials
        if: steps.window.outputs.proceed == 'true'
        run: |
          mkdir -p $HOME/.claude/credentials
          printenv BIGQUERY_KEY_JSON > $HOME/.claude/credentials/gowid-prd-bigquery-key.json
        env:
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}

      - name: Sync sheet + send alert
        if: steps.window.outputs.proceed == 'true'
        working-directory: ops/limit-integrity-alert
        run: node index.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # 있으면 슬랙 전체 검색으로 사유 수집, 없으면 상향심사 채널+CRM+해소 탭 이전 판정으로 폴백
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
