name: Limit Integrity Alert

# 한도 정합성 알럿 — 보증금(계약=입금=한도) / 발급(승인=현재) 대조 → 시트 갱신 + 슬랙 요약
# 트리거 구조는 card-pending-alert와 동일: 매시간 Update Dashboard Data 완료에 piggyback(1차) + 분산 cron(폴백).
# 슬랙 중복 발송은 index.js 멱등성 가드가 막고, 시트 갱신은 몇 번 돌아도 결과 동일.

on:
  schedule:
    - cron: '55 23 * * *'  # KST 08:55
    - cron: '25 0 * * *'   # KST 09:25
    - cron: '55 0 * * *'   # KST 09:55
  workflow_run:
    workflows: ["Update Dashboard Data"]
    types: [completed]
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Time window guard (workflow_run only)
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HOUR=$(date -u +%H)
            case "$HOUR" in
              23|00|01) echo "proceed=true" >> $GITHUB_OUTPUT ;;
              *) echo "proceed=false" >> $GITHUB_OUTPUT; echo "outside KST 08-10 window (UTC=$HOUR), skip" ;;
            esac
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.window.outputs.proceed == 'true'
        working-directory: ops/limit-integrity-alert
        run: npm install

      - name: Write BigQuery credentials
        if: steps.window.outputs.proceed == 'true'
        run: |
          mkdir -p $HOME/.claude/credentials
          printenv BIGQUERY_KEY_JSON > $HOME/.claude/credentials/gowid-prd-bigquery-key.json
        env:
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}

      - name: Sync sheet + send alert
        if: steps.window.outputs.proceed == 'true'
        working-directory: ops/limit-integrity-alert
        run: node index.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
