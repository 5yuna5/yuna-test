name: Card Pending Alert

on:
  schedule:
    # 매일 한국시간 오전 9:05 (UTC 0:05)
    - cron: '5 0 * * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: pm/context/card/operations/card-pending-alert
        run: npm install

      - name: Write BigQuery credentials
        run: |
          mkdir -p $HOME/.claude/credentials
          printenv BIGQUERY_KEY_JSON > $HOME/.claude/credentials/gowid-prd-bigquery-key.json
        env:
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}

      - name: Send alert
        working-directory: pm/context/card/operations/card-pending-alert
        run: node index.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
