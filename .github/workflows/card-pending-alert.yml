name: Card Pending Alert

on:
  schedule:
    # KST 시간대 분산 등록 — GitHub Actions cron 큐잉 지연 우회
    # 어느 트리거든 가장 먼저 풀린 인스턴스가 발송, 나머지는 멱등성 가드로 skip
    - cron: '50 23 * * *'  # KST 08:50
    - cron: '5 0 * * *'    # KST 09:05
    - cron: '20 0 * * *'   # KST 09:20
    - cron: '35 0 * * *'   # KST 09:35
    - cron: '50 0 * * *'   # KST 09:50
  workflow_dispatch: # 수동 실행도 가능

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ops/card-pending-alert
        run: npm install

      - name: Write BigQuery credentials
        run: |
          mkdir -p $HOME/.claude/credentials
          printenv BIGQUERY_KEY_JSON > $HOME/.claude/credentials/gowid-prd-bigquery-key.json
        env:
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}

      - name: Send alert
        working-directory: ops/card-pending-alert
        run: node index.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
