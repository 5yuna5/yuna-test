name: BizOps Due Alert

on:
  schedule:
    # 1차 발송 = Mac launchd 11:00 정각. 이 워크플로는 Mac이 꺼져 있을 때의 백업.
    # GitHub 저빈도 cron은 수시간 지연·누락되므로 KST 11:20~18:50 사이 30분마다 재시도.
    # 이미 오늘 보냈으면 index.js 멱등 가드가 skip → 하루 1회만 발송.
    - cron: '20,50 2-9 * * *'  # KST 11:20~18:50
  workflow_run:
    # Update Dashboard Data 완료 후 piggyback (실제로는 ~8시간 간격으로만 fire됨)
    workflows: ["Update Dashboard Data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Slack 미발송 미리보기만'
        type: boolean
        default: false

# 여러 트리거가 동시에 떠도 멱등 가드가 경쟁하지 않도록 직렬화
concurrency:
  group: bizops-due-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Time window guard
        id: window
        run: |
          # 수동 실행(dispatch) 외에는 KST 11~19시에만 진행.
          # - schedule: 수시간 지연된 cron이 새벽에 '다음 날' 알림을 먼저 보내는 것 방지
          # - workflow_run: KST 11시대는 Mac 1차 발송과 겹치지 않게 12시부터
          HOUR=$(TZ=Asia/Seoul date +%H)
          case "${{ github.event_name }}" in
            workflow_dispatch) OK=true ;;
            schedule) case "$HOUR" in 11|12|13|14|15|16|17|18|19) OK=true ;; *) OK=false ;; esac ;;
            *) case "$HOUR" in 12|13|14|15|16|17|18|19) OK=true ;; *) OK=false ;; esac ;;
          esac
          echo "proceed=$OK" >> $GITHUB_OUTPUT
          echo "trigger=${{ github.event_name }} KST_HOUR=$HOUR proceed=$OK"

      - uses: actions/checkout@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.window.outputs.proceed == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.window.outputs.proceed == 'true'
        working-directory: ops/bizops-due-alert
        run: npm ci

      - name: Send alert
        if: steps.window.outputs.proceed == 'true'
        working-directory: ops/bizops-due-alert
        run: node index.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
