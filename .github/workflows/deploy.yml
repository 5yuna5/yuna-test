name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 데이터 업데이트 푸시가 몇 분 내 연달아 일어나면 두 배포가 pages 환경에서
# 충돌해 "Deployment failed, try again later"로 실패한다. git 커밋은 누적이므로
# 최신 배포 하나만 실행하면 이전 업데이트도 모두 포함된다 → 이전 배포 취소.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
